name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: write

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test and build
        working-directory: frontend
        run: |
          npm ci
          npm test --if-present
          npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/mern-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in manifest
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: .*/mern-frontend:.*|image: ${{ vars.DOCKERHUB_USERNAME }}/mern-frontend:${{ github.sha }}|" k8s/frontend-deployment.yml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/frontend-deployment.yml
          git commit -m "ci: update frontend image to ${{ github.sha }} [skip ci]"
          git push
