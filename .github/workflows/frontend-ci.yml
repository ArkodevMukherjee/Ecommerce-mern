name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/mern-frontend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/mern-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    name: Update image tag in k8s manifest
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-manifest
      cancel-in-progress: false

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set new image tag
        run: |
          sed -i "s|image: .*/mern-frontend:.*|image: ${{ vars.DOCKERHUB_USERNAME }}/mern-frontend:${{ github.sha }}|" k8s/frontend-deployment.yaml
          grep "image:" k8s/frontend-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No manifest changes to commit"
          else
            git add k8s/frontend-deployment.yaml
            git commit -m "ci: deploy frontend ${{ github.sha }}"
            git pull --rebase origin main
            git push origin main
          fi