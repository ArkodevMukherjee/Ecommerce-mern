apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: mern-proj
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: mern-frontend
          image: arkodevmukherjee1234/mern-frontend:8bf7c176cc2293ec553862b8bcdb81410963b8af
          ports:
            - containerPort: 80