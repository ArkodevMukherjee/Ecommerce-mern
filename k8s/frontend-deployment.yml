apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: mern-proj
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: mern-frontend
          image: arkodevmukherjee1234/mern-frontend:704ab8dc20ffb90cc359498a294bdeb8b72245e4
          ports:
            - containerPort: 80