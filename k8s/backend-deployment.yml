apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: mern-proj
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: mern-backend
          image: arkodevmukherjee1234/mern-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              value: "mongodb://mongodb-service:27017/ecommerce"
            - name: JWT_SECRET
              value: "abc123456789"